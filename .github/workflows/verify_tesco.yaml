name: Verify Tesco full refresh

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'countries/uk/tesco/**'
      - 'countries/uk/_shared/**'
      - 'scripts/verify_tesco_refresh.py'
      - '.github/workflows/verify_tesco.yaml'

permissions:
  contents: read

concurrency:
  group: verify-tesco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full Tesco scrape (no publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout test revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.8'
          check-latest: false
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install daily scraper runtime
        run: |
          pip install -r requirements.txt
          pip check
          python -m playwright install --with-deps chromium
          python -m playwright install chrome

      - name: Verify all searches and fresh catalog gates
        env:
          PLAYWRIGHT_CHANNEL: chrome
          PLAYWRIGHT_HEADED: '1'
          PYTHONUNBUFFERED: '1'
        run: xvfb-run -a python scripts/verify_tesco_refresh.py

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tesco-refresh-verification
          path: |
            artifacts/tesco-status.json
            artifacts/tesco-health.json
            artifacts/search-diagnostics/
          retention-days: 7
          if-no-files-found: warn
