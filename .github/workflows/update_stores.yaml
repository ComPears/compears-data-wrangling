name: Daily supermarket scrapers

# Three independent stages:
# 1) scrape   – best-effort per store; preserves last-known observations
# 2) publish  – only commits fresh, contract-valid required catalogs
# 3) sync     – seed backend from published catalogs and deploy
#
# Workflow green means fresh offers passed the full quality contract.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-supermarket-scrapers
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape ${{ matrix.country }}/${{ matrix.store }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Timeouts/cancellations for one store must not fail the matrix parent or
    # prevent publish/sync of every other store's last-good catalog.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - country: nl
            store: albert-heijn
            playwright: false
          - country: nl
            store: aldi
            playwright: true
          - country: nl
            store: dirk
            playwright: true
          - country: nl
            store: plus
            playwright: true
          - country: nl
            store: lidl
            playwright: true
          - country: nl
            store: coop
            playwright: true
          - country: nl
            store: jumbo
            playwright: true
          - country: uk
            store: tesco
            playwright: true
          - country: uk
            store: sainsburys
            playwright: true
          - country: uk
            store: morrisons
            playwright: true
          - country: uk
            store: aldi-uk
            playwright: true
          - country: uk
            store: lidl-uk
            playwright: true
          - country: uk
            store: asda
            playwright: true
          - country: de
            store: edeka
            playwright: true
          - country: de
            store: rewe
            playwright: true
          - country: de
            store: lidl-de
            playwright: true
          - country: de
            store: aldi-sud
            playwright: true
          - country: de
            store: penny
            playwright: true

    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.8'
          check-latest: false
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium runtime
        if: matrix.playwright
        run: python -m playwright install --with-deps chromium

      - name: Install Chrome channel for Asda
        if: matrix.store == 'asda'
        run: python -m playwright install chrome

      - name: Generate catalog
        env:
          UK_MAX_QUERIES: '80'
          UK_MAX_BLOCKED_QUERIES: '3'
          UK_MAX_EMPTY_QUERIES: '5'
          DE_MAX_QUERIES: '80'
          DE_MAX_BLOCKED_QUERIES: '3'
          DE_MAX_EMPTY_QUERIES: '5'
          # Keep AH under the job timeout; barcode backfill can run separately.
          AH_DETAIL_ENRICH_LIMIT: ${{ matrix.store == 'albert-heijn' && '400' || '0' }}
          PLAYWRIGHT_CHANNEL: ${{ matrix.store == 'asda' && 'chrome' || '' }}
          STATUS_FILE: artifacts/catalog/reports/scrape-status/${{ matrix.country }}-${{ matrix.store }}.json
        run: >-
          python scripts/run_store_pipeline.py
          --country "${{ matrix.country }}"
          --store "${{ matrix.store }}"
          --soft-fail
          --status-file "$STATUS_FILE"

      - name: Stage canonical catalog artifact
        if: always()
        env:
          STATUS_FILE: artifacts/catalog/reports/scrape-status/${{ matrix.country }}-${{ matrix.store }}.json
        run: >-
          python scripts/stage_store_artifact.py
          --country "${{ matrix.country }}"
          --store "${{ matrix.store }}"
          --status-file "$STATUS_FILE"

      - name: Upload canonical catalog artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-${{ matrix.country }}-${{ matrix.store }}
          path: artifacts/catalog
          if-no-files-found: error
          retention-days: 7

      - name: Upload immutable raw observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.country }}-${{ matrix.store }}
          path: artifacts/raw
          if-no-files-found: warn
          retention-days: 3

  publish:
    name: Publish last-good catalog snapshot
    needs: scrape
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.catalog_commit.outputs.sha }}

    steps:
      - name: Checkout latest catalog state
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download all scraper artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: catalog-*
          merge-multiple: true
          path: .

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.8'
          check-latest: false
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: pip install -r requirements.txt

      - name: Summarize store refresh outcomes
        run: python scripts/summarize_scrape_status.py

      - name: Sanitize canonical product JSON
        run: python scripts/sanitize_all_stores.py

      # Hard gate: required stores must keep usable last-good catalogs.
      - name: Validate required store output counts
        run: python scripts/validate_store_output.py

      - name: Run catalog regression tests
        run: python -m unittest discover -s tests -t . -v

      - name: Validate data quality report
        run: python scripts/validate_products.py

      - name: Generate catalog health report
        run: python scripts/catalog_health.py --fail-on error

      - name: Build confidence-scored comparison index
        run: python scripts/build_match_index.py

      - name: Catalog freshness and drop alerts
        env:
          CATALOG_MAX_AGE_HOURS: '48'
          CATALOG_MAX_DROP_RATIO: '0.2'
          CATALOG_MAX_GROWTH_RATIO: '1.75'
        run: python scripts/workflow_catalog_alerts.py

      - name: Write publish manifest
        run: python scripts/write_catalog_manifest.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-diagnostics
          path: |
            reports/catalog-health.json
            reports/catalog-manifest.json
            reports/match-quality.json
            reports/matches/*.json
            reports/quarantine/*.json
            reports/scrape-status/*.json
            data-quality-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove stale intermediate JSON
        run: python scripts/prune_stale_artifacts.py --from-git

      - name: Commit published catalog snapshot
        id: catalog_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Persist the quality report so versioned count-baseline migrations
          # reset once; later unexplained catalog drops are blocked again.
          git add -A countries data-quality-report.json
          if git diff --cached --quiet; then
            echo "No validated catalog changes to commit"
          else
            git commit -m "Automated validated catalog update $(date -u +'%Y-%m-%d %H:%M:%SZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Optional same-day accelerator. Reliable sync is the backend repo's daily
  # "Seed backend product data" workflow, which does not need a cross-repo PAT.
  sync:
    name: Trigger backend seed
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A missing/expired BACKEND_REPO_TOKEN must not fail the scrape/publish pipeline.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Trigger backend seed workflow
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BACKEND_REPO_TOKEN is missing. Skipping same-day sync trigger."
            echo "Backend will still pick up published catalogs via its daily seed workflow."
            echo "Create a fine-grained PAT with Contents: Read/Write + Actions: Write on Compear-backend,"
            echo "then store it as secret BACKEND_REPO_TOKEN in compears-data-wrangling."
            exit 0
          fi

          if ! gh api user --jq .login >/dev/null 2>&1; then
            echo "::warning::BACKEND_REPO_TOKEN is invalid or expired. Skipping same-day sync trigger."
            echo "Rotate the PAT and update secret BACKEND_REPO_TOKEN. Daily backend seed remains the fallback."
            exit 0
          fi

          gh workflow run "Seed backend product data" \
            --repo ComPears/compear-backend \
            --ref main
          echo "Triggered ComPears/compear-backend seed workflow"
