name: Daily supermarket scrapers

# Three independent stages:
# 1) scrape   – best-effort per store; never blocks delivery
# 2) publish  – commit last-good catalogs that pass required hard gates
# 3) sync     – seed backend from published catalogs and deploy
#
# Workflow green means publish + sync completed with usable last-good data.
# Per-store bot-walls/timeouts are coverage warnings, not delivery failures.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-supermarket-scrapers
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape ${{ matrix.country }}/${{ matrix.store }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Timeouts/cancellations for one store must not fail the matrix parent or
    # prevent publish/sync of every other store's last-good catalog.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - country: nl
            store: albert-heijn
            playwright: false
          - country: nl
            store: aldi
            playwright: true
          - country: nl
            store: dirk
            playwright: true
          - country: nl
            store: plus
            playwright: true
          - country: nl
            store: lidl
            playwright: true
          - country: nl
            store: coop
            playwright: true
          - country: nl
            store: jumbo
            playwright: true
          - country: uk
            store: tesco
            playwright: true
          - country: uk
            store: sainsburys
            playwright: true
          - country: uk
            store: morrisons
            playwright: true
          - country: uk
            store: aldi-uk
            playwright: true
          - country: uk
            store: lidl-uk
            playwright: true
          - country: uk
            store: asda
            playwright: true
          - country: de
            store: edeka
            playwright: true
          - country: de
            store: rewe
            playwright: true
          - country: de
            store: lidl-de
            playwright: true
          - country: de
            store: aldi-sud
            playwright: true
          - country: de
            store: penny
            playwright: true

    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.8'
          check-latest: false
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium runtime
        if: matrix.playwright
        run: python -m playwright install --with-deps chromium

      - name: Install Chrome channel for Asda
        if: matrix.store == 'asda'
        run: python -m playwright install chrome

      - name: Generate catalog
        env:
          UK_MAX_QUERIES: '80'
          UK_MAX_BLOCKED_QUERIES: '3'
          UK_MAX_EMPTY_QUERIES: '5'
          DE_MAX_QUERIES: '80'
          DE_MAX_BLOCKED_QUERIES: '3'
          DE_MAX_EMPTY_QUERIES: '5'
          # Keep AH under the job timeout; barcode backfill can run separately.
          AH_DETAIL_ENRICH_LIMIT: ${{ matrix.store == 'albert-heijn' && '400' || '0' }}
          PLAYWRIGHT_CHANNEL: ${{ matrix.store == 'asda' && 'chrome' || '' }}
          STATUS_FILE: artifacts/catalog/reports/scrape-status/${{ matrix.country }}-${{ matrix.store }}.json
        run: >-
          python scripts/run_store_pipeline.py
          --country "${{ matrix.country }}"
          --store "${{ matrix.store }}"
          --soft-fail
          --status-file "$STATUS_FILE"

      - name: Stage canonical catalog artifact
        if: always()
        env:
          STATUS_FILE: artifacts/catalog/reports/scrape-status/${{ matrix.country }}-${{ matrix.store }}.json
        run: >-
          python scripts/stage_store_artifact.py
          --country "${{ matrix.country }}"
          --store "${{ matrix.store }}"
          --status-file "$STATUS_FILE"

      - name: Upload canonical catalog artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-${{ matrix.country }}-${{ matrix.store }}
          path: artifacts/catalog
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish last-good catalog snapshot
    needs: scrape
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.catalog_commit.outputs.sha }}

    steps:
      - name: Checkout latest catalog state
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download all scraper artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: catalog-*
          merge-multiple: true
          path: .

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.8'
          check-latest: false
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: pip install -r requirements.txt

      - name: Summarize store refresh outcomes
        run: python scripts/summarize_scrape_status.py

      - name: Sanitize canonical product JSON
        run: python scripts/sanitize_all_stores.py

      # Hard gate: required stores must keep usable last-good catalogs.
      - name: Validate required store output counts
        run: python scripts/validate_store_output.py

      - name: Run catalog regression tests
        run: python -m unittest discover -s tests -t . -v

      # Soft gates: observability only — never block publish/sync.
      - name: Validate data quality report
        continue-on-error: true
        run: python scripts/validate_products.py

      - name: Generate catalog health report
        continue-on-error: true
        run: python scripts/catalog_health.py --fail-on error

      - name: Catalog freshness and drop alerts
        env:
          CATALOG_MAX_AGE_HOURS: '72'
          CATALOG_MAX_DROP_RATIO: '0.5'
          CATALOG_MAX_GROWTH_RATIO: '3'
        run: python scripts/workflow_catalog_alerts.py --warn-only

      - name: Write publish manifest
        run: python scripts/write_catalog_manifest.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-diagnostics
          path: |
            reports/catalog-health.json
            reports/catalog-manifest.json
            reports/scrape-status/*.json
            data-quality-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove stale intermediate JSON
        run: python scripts/prune_stale_artifacts.py --from-git

      - name: Commit published catalog snapshot
        id: catalog_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A countries
          if git diff --cached --quiet; then
            echo "No validated catalog changes to commit"
          else
            git commit -m "Automated validated catalog update $(date -u +'%Y-%m-%d %H:%M:%SZ')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync published snapshot to backend
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout data-wrangling repository
        uses: actions/checkout@v7
        with:
          ref: main
          path: compears-data-wrangling
          fetch-depth: 1

      - name: Checkout backend repository
        uses: actions/checkout@v7
        with:
          repository: ComPears/compear-backend
          ref: main
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: compear-backend
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compear-backend/package-lock.json

      - name: Seed backend product data
        working-directory: compear-backend
        env:
          WRANGLING_PATH: ${{ github.workspace }}/compears-data-wrangling
          COUNTRY: nl,uk,de
        run: |
          npm ci
          npm run seed

      - name: Push backend data snapshot
        id: backend_commit
        working-directory: compear-backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/nl/*.json src/data/uk/*.json src/data/de/*.json 2>/dev/null || true
          git add src/data/nl src/data/uk src/data/de
          if git diff --cached --quiet; then
            echo "No backend data changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # [skip ci] keeps flaky/large data churn out of Backend CI.
            git commit -m "Automated validated data sync $(date -u +'%Y-%m-%d %H:%M:%SZ') [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger Render backend deployment
        if: steps.backend_commit.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set; relying on Render auto-deploy"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST "$RENDER_DEPLOY_HOOK_URL"

      # Deploy readiness is monitored, not a delivery hard-gate.
      - name: Verify backend revision readiness
        if: steps.backend_commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || vars.BACKEND_URL }}
          EXPECTED_COMMIT: ${{ steps.backend_commit.outputs.sha }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "::warning::BACKEND_BASE_URL not set; skipping readiness probe"
            exit 0
          fi
          health_url="${BACKEND_BASE_URL%/}/health/ready"
          for attempt in $(seq 1 60); do
            if payload=$(curl --fail --silent --show-error --max-time 20 "$health_url"); then
              deployed_commit=$(echo "$payload" | jq -r '.deployment.commit // empty')
              if [ "$deployed_commit" = "$EXPECTED_COMMIT" ]; then
                echo "$payload"
                echo "Expected backend revision is ready"
                exit 0
              fi
              echo "Attempt $attempt/60: ready revision ${deployed_commit:-unknown}; waiting for $EXPECTED_COMMIT"
            else
              echo "Attempt $attempt/60: backend not ready yet"
            fi
            sleep 10
          done
          echo "::warning::Expected backend revision $EXPECTED_COMMIT did not become ready within 10 minutes"
          exit 0
